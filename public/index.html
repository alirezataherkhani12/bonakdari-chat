<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بنکداری طاهرخانی</title>
    <style>
        body { font-family: Tahoma, sans-serif; margin: 0; background-color: #f0f2f5; }
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #2c3e50; display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .login-box { background: white; padding: 20px; border-radius: 10px; width: 80%; max-width: 300px; text-align: center; }
        input { width: 90%; padding: 10px; margin: 5px 0; border: 1px solid #ddd; border-radius: 5px; text-align: center; }
        button { width: 100%; padding: 10px; background: #2980b9; color: white; border: none; border-radius: 5px; margin-top: 10px; }
        #error-msg { color: red; display: none; margin-top: 10px; font-size: 12px; }
        #chat-screen { display: none; height: 100vh; flex-direction: column; }
        header { background: #2c3e50; color: white; padding: 15px; text-align: center; }
        #messages { flex: 1; overflow-y: auto; padding: 10px; list-style: none; margin: 0; }
        .message-bubble { background: white; padding: 8px 12px; margin-bottom: 8px; border-radius: 8px; width: fit-content; max-width: 80%; }
        .system-msg { text-align: center; font-size: 12px; color: #777; margin: 5px 0; }
        form { background: #ddd; padding: 10px; display: flex; }
        form input { flex: 1; margin-left: 10px; }
        form button { width: 60px; margin-top: 0; background: green; }
    </style>
</head>
<body>
    <div id="login-screen">
        <div class="login-box">
            <h3>ورود پرسنل</h3>
            <input id="n" placeholder="نام">
            <input id="ln" placeholder="نام خانوادگی">
            <input type="password" id="p" placeholder="رمز عبور">
            <button onclick="login()">ورود</button>
            <div id="error-msg"></div>
        </div>
    </div>
    <div id="chat-screen">
        <header>بنکداری طاهرخانی</header>
        <ul id="messages"></ul>
        <form id="f"><input id="m" autocomplete="off"><button>ارسال</button></form>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        var socket = io();
        function login() {
            var n=document.getElementById('n').value, ln=document.getElementById('ln').value, p=document.getElementById('p').value;
            if(n && ln && p) socket.emit('loginAttempt', {name:n, surname:ln, password:p});
        }
        socket.on('loginSuccess', ()=>{document.getElementById('login-screen').style.display='none'; document.getElementById('chat-screen').style.display='flex';});
        socket.on('loginError', (t)=>{var e=document.getElementById('error-msg');e.innerText=t;e.style.display='block';});
        document.getElementById('f').addEventListener('submit', (e)=>{e.preventDefault(); var i=document.getElementById('m'); if(i.value){socket.emit('chatMessage', i.value); i.value='';}});
        socket.on('message', (msg)=>{
            var li=document.createElement('li');
            if(msg.type=='system'){li.className='system-msg'; li.innerText=msg.text;}
            else{li.className='message-bubble'; li.innerHTML=`<b>${msg.user}:</b> ${msg.text}`;}
            document.getElementById('messages').appendChild(li);
        });
    </script>
</body>
</html>
